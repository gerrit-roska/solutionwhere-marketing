slug: solutionwhere-marketing
name: Solutionwhere Marketing

# Scaffold provenance. The Graphed CLI reads this to check plugin
# compatibility; it is stripped on deploy and never sent to the server.
scaffold:
  name: base
  version: 0.1.0

databases:
  primary:
    env: DATABASE_URL

release:
  command: npm run db:migrate
  timeout_seconds: 600
  retries: 1

services:
  dashboard:
    command: node packages/dashboard/.next/standalone/packages/dashboard/server.js
    port: 3000
    healthcheck: /api/health
    # Injected so dashboard publish/unpublish can reach Strapi. Values live
    # in Graphed secrets, not in this file.
    env:
      - STRAPI_API_URL
      - STRAPI_API_TOKEN
      - FB_ACCESS_TOKEN
      - FB_AD_ACCOUNT_ID
      - FB_PAGE_ID

